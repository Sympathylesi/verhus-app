<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#1a6b45"/>
  <!-- syringe body -->
  <g transform="translate(16,16) rotate(-45) translate(-16,-16)">
    <!-- needle tip -->
    <line x1="22" y1="10" x2="25" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <!-- barrel -->
    <rect x="10" y="13" width="12" height="6" rx="1.5" fill="white"/>
    <!-- plunger rod -->
    <line x1="7" y1="16" x2="10" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- plunger handle -->
    <line x1="6" y1="13" x2="6" y2="19" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- needle connector -->
    <rect x="22" y="14.5" width="3" height="3" rx="0.5" fill="white"/>
    <!-- graduation marks -->
    <line x1="14" y1="13" x2="14" y2="19" stroke="#1a6b45" stroke-width="1"/>
    <line x1="17" y1="13" x2="17" y2="19" stroke="#1a6b45" stroke-width="1"/>
    <line x1="20" y1="13" x2="20" y2="19" stroke="#1a6b45" stroke-width="1"/>
    <!-- liquid fill -->
    <rect x="14" y="13.5" width="6" height="5" rx="0.5" fill="#6ee7b7" opacity="0.6"/>
  </g>
</svg>
