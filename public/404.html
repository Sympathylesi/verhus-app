<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname.replace('/verhus-app', '') || '/';
      const search = window.location.search;
      const hash = window.location.hash;
      window.location.replace(
        '/verhus-app/?p=' + encodeURIComponent(path + search) + hash
      );
    </script>
  </head>
  <body></body>
</html>
